name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# One install job caches the workspace; parallel check jobs restore it and
# only run their step (no second pnpm install).
env:
  PNPM_VERSION: 10.8.0
  NODE_VERSION: "22"

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Keyed by commit so parallel jobs always restore *this* install, not a
      # stale cache from another branch/run.
      - name: Cache install for parallel jobs
        uses: actions/cache/save@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
            apps/*/node_modules
            scripts/*/node_modules
          key: ci-install-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}

  typecheck:
    needs: setup
    runs-on: ubuntu-latest
    env:
      # SST/Pulumi types push tsc over the default ~2GB heap on GHA runners.
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Restore install
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
            apps/*/node_modules
            scripts/*/node_modules
          key: ci-install-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          fail-on-cache-miss: true
      - run: pnpm --filter=@delulu/infra exec sst install
      - run: pnpm typecheck

  test:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Restore install
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
            apps/*/node_modules
            scripts/*/node_modules
          key: ci-install-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          fail-on-cache-miss: true
      - run: pnpm test

  browser:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Restore install
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
            apps/*/node_modules
            scripts/*/node_modules
          key: ci-install-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          fail-on-cache-miss: true
      - run: pnpm --filter app exec playwright install --with-deps chromium
      - run: pnpm verify:browser
      - name: Browser report and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-verification
          path: |
            apps/app/.cache/browser-report
            apps/app/.cache/browser-results
          retention-days: 14

  postgres-integration:
    needs: setup
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: delulu
          POSTGRES_USER: delulu
          POSTGRES_PASSWORD: delulu
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U delulu -d delulu"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://delulu:delulu@localhost:5432/delulu
      ENCRYPTION_SECRET: ci-test-encryption-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Restore install
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
            apps/*/node_modules
            scripts/*/node_modules
          key: ci-install-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          fail-on-cache-miss: true
      - run: pnpm pg:migrate
      - run: pnpm --filter=@delulu/db test:integration
      - run: pnpm --filter=@delulu/services test:integration
      - run: pnpm --filter=@delulu/http-api test:integration
      - run: pnpm --filter=@delulu/worker test:integration
      - run: pnpm --filter=@delulu/migrate-convex test:integration

  invariants:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Restore install
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
            apps/*/node_modules
            scripts/*/node_modules
          key: ci-install-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          fail-on-cache-miss: true
      - run: pnpm pg:migration-lint
      - run: >-
          node --test
          scripts/validate-production-database-url.test.mjs
          scripts/run-cloudflare-production-migration.test.mjs
      - run: pnpm check:connections-boundary
      - run: pnpm check:backend-cutover
      - run: pnpm icons:check
